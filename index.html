<style>
:root{--bg:#0e1a12;--card:#16281c;--line:#26402d;--tx:#e9f3ea;--mut:#8fae95;--ac:#3ddc84;--bad:#ff6b6b;--warn:#ffd166;--hd:#0b3d1e;--btn:#1d3626;--hl:#1f4a2b;--hdt:#bfe3c7;--onac:#062}

.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}

.z1{border-left:3px solid var(--ac)}.z2{border-left:3px solid var(--bad)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.ctlr{justify-content:center;flex-wrap:wrap}.ctlr select,.ctlr button{padding:6px 10px;font-size:13px}.ctlr select,.ctlr button{margin:0}.rt{display:flex;align-items:center;gap:5px;flex:none;white-space:nowrap}.ovc{width:22px;text-align:right}.vl{width:82px;text-align:right;font-size:11px}.rt button{padding:5px 8px}.pl>span:first-child{min-width:0;flex:1;padding-right:6px}.pc{flex:none!important;width:38px;padding:0!important;display:flex;flex-direction:column;align-items:center;line-height:1.25;font-size:11px}.pc .pos{margin:0;min-width:0;width:auto}.nm{flex:1;min-width:0;padding:0 6px}.pl{display:flex;justify-content:space-between;align-items:center;padding:7px 4px;border-bottom:1px solid var(--line)}

.lin.dup{justify-content:center;gap:14%}

.jog{display:flex;flex-direction:column;align-items:center;width:20%;min-width:0}
.jog i{font-style:normal;font-weight:800;font-size:13px;width:31px;height:31px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:2px solid #fff;box-shadow:0 1px 4px #0008}
.jog small{display:block;font-size:9px;opacity:.8}
.jog span{font-size:10px;line-height:1.1;color:#fff;text-shadow:0 1px 2px #000;margin-top:2px;max-width:100%;text-align:center;white-space:normal;overflow-wrap:anywhere}
.brk{display:flex;gap:22px;overflow-x:auto;padding:4px 2px 8px;align-items:stretch}.bc{display:flex;flex-direction:column;min-width:200px;flex:none}.bl{flex:1;display:flex;flex-direction:column;justify-content:space-around;gap:12px;padding-top:8px}.bh{font-size:12px;color:var(--mut);text-align:center;font-weight:700;text-transform:uppercase;letter-spacing:.5px}.bt{position:relative;background:var(--btn);border:1px solid var(--line);border-radius:10px;overflow:visible}.bt>div{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:5px 8px}.bt>div+div{border-top:1px solid var(--line)}.bt .tb{font-size:13px;margin:0;padding:2px 7px}.bt .l{opacity:.5}.bt.m{border-color:var(--ac)}.bp{display:flex;flex-direction:column;gap:6px;background:rgba(255,255,255,.05);border-radius:12px;padding:6px}.bn{font-size:10px;color:var(--mut);padding:0 4px}
@media(min-width:1000px){main{max-width:1680px;padding:14px 24px 84px}#app{display:grid;grid-template-columns:repeat(auto-fill,minmax(440px,1fr));gap:14px;align-items:start}#app>.card{margin-bottom:0}#app>*:not(.card),#app>.card.wide{grid-column:1/-1}.lv{display:grid;grid-template-columns:minmax(300px,.8fr) minmax(420px,1.3fr) minmax(380px,1fr);gap:14px;align-items:start;grid-column:1/-1}.lva{grid-column:1;grid-row:1}.lvb{grid-column:2;grid-row:1}.lvr{grid-column:3;grid-row:1}.lva>.card,.lvb>.card{margin-bottom:12px}.lvr{position:sticky;top:64px;max-height:calc(100vh - 140px);overflow:auto}.mg{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:12px;align-items:start}.mg>.card{margin-bottom:0}.lvl>.card{margin-bottom:12px}}
@media(min-width:1000px){.lvb>.card.mine{padding:18px}.lvb>.card.mine .mrow{font-size:34px}.lvb>.card.mine .mrow .tb{font-size:22px;padding:6px 12px}.lvb>.card.mine .evg{font-size:17px!important;gap:10px!important}.lva .mrow{font-size:20px}.lva .mrow .tb{font-size:14px;padding:3px 8px}.lvb>.card:first-child .big{font-size:30px}.lvr .pl{font-size:15px}}
@media(min-width:1000px){#app>.elg{grid-column:1/-1;display:grid;grid-template-columns:minmax(340px,1fr) minmax(460px,1.4fr) minmax(300px,1fr);gap:14px;align-items:stretch}.elg>div{min-width:0}.el1{display:flex;flex-direction:column;gap:14px}.el1>.card{margin:0}.el1>.card:last-child{flex:1}.el2>.card,.elg>.el3{margin:0}.elg>.el3{align-self:start}}
@media(min-width:1000px){.tbw table{font-size:16px}.tbw td,.tbw th{padding:7px 10px}.tbw td:not(.l),.tbw th:not(.l){width:8%}}
.brk2{display:none}
@media(min-width:1000px){.brk.has2{display:none}.brk2{display:block;overflow-x:auto;padding:4px 2px 12px}.tr2{display:flex;gap:22px;align-items:flex-start}.pl0{display:flex;flex-direction:column;gap:10px;flex:none}.pl0 .bt,.trt .bt{width:230px}.trh1,.trh>div{font-size:12px;color:var(--mut);text-align:center;font-weight:700;text-transform:uppercase;letter-spacing:.5px;padding-bottom:8px}.trh{display:flex}.trh>div{width:260px;flex:none}.trt{display:flex;align-items:center}.bn{display:flex;align-items:center}.bk{display:flex;flex-direction:column;position:relative;margin-right:15px}.bk::after{content:"";position:absolute;right:-15px;top:50%;width:15px;border-top:2px solid var(--mut)}.bk>.bn{position:relative;padding-right:15px;margin:7px 0}.bk>.bn:first-child::after,.bk>.bn:last-child::after{content:"";position:absolute;right:0;width:15px;border-right:2px solid var(--mut)}.bk>.bn:first-child::after{top:50%;bottom:-7px;border-top:2px solid var(--mut)}.bk>.bn:last-child::after{top:-7px;bottom:50%;border-bottom:2px solid var(--mut)}}
.mc{display:contents}
.desk-only{display:none}
@media(min-width:1000px){.mob-only{display:none}#app>.elg.desk-only{grid-template-columns:repeat(3,minmax(0,1fr));align-items:start}.desk-only>.card{margin:0}}
@media(min-width:1000px){#app>.mcg{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:start}.mc{display:flex;flex-direction:column;gap:14px;min-width:0}.mc>.card{margin:0}}
@media(min-width:1000px){#app>.jgl{grid-column:1/-1;grid-template-columns:minmax(0,1fr) 420px;grid-template-rows:auto 1fr;align-items:start}.jgl>.mbig{grid-column:2;grid-row:1;margin:0!important;padding:16px 14px!important}.jgl>.el1{grid-column:1;grid-row:1/span 2}.jgl>.el3{grid-column:2;grid-row:2}.jgl .campo{height:clamp(360px,calc(100dvh - 330px),950px)}.jgl .jog i{width:clamp(32px,calc((100dvh - 330px)/11),44px);height:clamp(32px,calc((100dvh - 330px)/11),44px);font-size:16px}.jgl .jog span{font-size:13px;font-weight:600;line-height:1.15}.jgl .jog small{font-size:11px;line-height:1.1}.mbig>div:first-child{font-size:22px!important;line-height:1.3}.mbig p{font-size:14px!important}}
@media(min-width:1000px){.el1>.card.pr{flex:1;padding:20px 18px!important}.el1>.card.pr [style*="font-size:13px"]{font-size:18px!important;padding:6px 0!important}.el1>.card.pr [style*="font-size:11px"]{font-size:15px!important;margin-top:8px!important}.el1>.card.esc{flex:none;padding:8px 12px}.el1>.card.esc h2{font-size:14px;margin:0 0 4px}}
@media(max-width:999px){.lvr,.el3{display:none}}
.ur{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}.urk{font-weight:800;width:20px;flex:none}.urm{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap;font-size:16px;text-align:center}.urd{font-size:12px;flex:none;text-align:right}@media(max-width:700px){.ur{flex-wrap:wrap;gap:2px 8px}.urm{order:3;flex-basis:100%}.urd{margin-left:auto}}
</style>

<body>
<header><div class="hl"><span id="crest"></span><b id="hT">Meu Elifoot</b></div><div class="hr"><span id="flag"></span><span id="hS"></span></div></header>
<main id="app"></main>
<nav id="nav"></nav>
<script src="clubs.js?v=186"></script>
<script src="game.js?v=186"></script>
<script src="campo.js?v=186"></script>
<script src="campo3d.js?v=186"></script>
<script>
const PREFIX="elifoot:save:",SAVE1="Elifoot"; // um único save para todos os times
let artCan=false,S=null,tab="jogo",msg="",mf={pos:"",q:"",any:true,min:1,max:null,afford:true,ord:"ovr",dir:-1},viewKey=null;
const $=id=>document.getElementById(id);
const VERSAO=186;
const moneyFull=n=>(n<0?"-":"")+"R$ "+Math.round(Math.abs(n)).toLocaleString("pt-BR");
const money=moneyFull;
const U=()=>S.teams[S.user];
const LGu=()=>Game.LG[U().lkey];

// ---- salvamento automático com o nome do time (mesmo nome = sobrescreve) ----
let _tt=null;
function toast(t,ms){let e=document.getElementById("toast");if(!e){e=document.createElement("div");e.id="toast";e.style.cssText="position:fixed;top:74px;right:12px;z-index:50;background:#000c;color:#fff;font-size:12px;padding:6px 10px;border-radius:14px;transition:opacity .4s;pointer-events:none";document.body.appendChild(e)}e.textContent=t;e.style.opacity=1;clearTimeout(_tt);_tt=setTimeout(()=>e.style.opacity=0,ms||1400)}
function save(){
  try{const old=S.saveName;S.saveName=SAVE1;if(old&&old!==SAVE1){localStorage.removeItem(PREFIX+old);localStorage.removeItem(TSK+old);syncDelete(old)}localStorage.setItem(PREFIX+S.saveName,JSON.stringify(S));localStorage.setItem("elifoot:last",S.saveName);localStorage.setItem(TSK+S.saveName,Date.now());syncPushLater(S.saveName);toast("💾 Jogo salvo")}
  catch(e){alert("Sem espaço no aparelho para salvar. Apague saves antigos na tela inicial.")}
}

// ---- sincronização entre aparelhos (gist privado do GitHub, comprimido) ----
const SYK="elifoot:sy:",TSK="elifoot:ts:",GK="elifoot:gist",GDESC="elifoot-saves";
const gcfg=()=>{try{return JSON.parse(localStorage.getItem(GK)||"null")}catch(e){return null}};
const gset=c=>localStorage.setItem(GK,JSON.stringify(c));
const fname=n=>"save-"+encodeURIComponent(n)+".txt";
async function gz(str){const cs=new Blob([str]).stream().pipeThrough(new CompressionStream("gzip"));const b=new Uint8Array(await new Response(cs).arrayBuffer());let bin="";for(let i=0;i<b.length;i+=8192)bin+=String.fromCharCode.apply(null,b.subarray(i,i+8192));return btoa(bin)}
async function ungz(b64){const bin=atob(b64),b=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)b[i]=bin.charCodeAt(i);const ds=new Blob([b]).stream().pipeThrough(new DecompressionStream("gzip"));return await new Response(ds).text()}
async function gapi(path,method,body){const c=gcfg();const r=await fetch("https://api.github.com"+path+((method||"GET")==="GET"?(path.includes("?")?"&":"?")+"_="+Date.now():""),{cache:"no-store",method:method||"GET",headers:{Authorization:"Bearer "+c.token,Accept:"application/vnd.github+json","Content-Type":"application/json"},body:body?JSON.stringify(body):undefined});if(!r.ok)throw new Error("GitHub "+r.status);return r.json()}
let _pt=null,SYNCST="";
function syncSt(t){SYNCST=t;const e=document.getElementById("syncSt");if(e)e.textContent=t}
function syncPushLater(name){if(!gcfg())return;clearTimeout(_pt);_pt=setTimeout(()=>syncPush(name),800)}
async function syncPush(name){
  const c=gcfg();if(!c||!c.id)return;
  try{syncSt("Enviando save para a nuvem...");const raw=localStorage.getItem(PREFIX+name);if(!raw)return;
    const ts=+localStorage.getItem(TSK+name)||Date.now();
    await gapi("/gists/"+c.id,"PATCH",{files:{[fname(name)]:{content:ts+"|"+await gz(raw)}}});localStorage.setItem(SYK+name,ts);syncSt("☁️ Enviado às "+new Date().toLocaleTimeString("pt-BR")+" · save de "+new Date(ts).toLocaleString("pt-BR"))}
  catch(e){syncSt("Falha ao enviar: "+e.message)}
}
// ao voltar para o app (ou focar a janela): envia o que está pendente e baixa o save mais novo da nuvem, sem pergunta, se este aparelho não tem alteração pendente
try{for(const n of listSaves())if(localStorage.getItem(SYK+n)==null)localStorage.setItem(SYK+n,localStorage.getItem(TSK+n)||0)}catch(e){}
let _sw=0,_sb=false,_sr=null;
async function syncWatch(force){
  const c=gcfg();if(!c||!c.id||_sb||!S||LIVE||(!force&&Date.now()-_sw<8000))return;_sw=Date.now();_sb=true;
  try{
    const nm=S.saveName,loc0=+localStorage.getItem(TSK+nm)||0,sy0=+localStorage.getItem(SYK+nm)||0;
    const g=await gapi("/gists/"+c.id);let cloud=null;
    for(const f of Object.values(g.files)){if(!f.filename.startsWith("save-"))continue;
      const name=decodeURIComponent(f.filename.slice(5,-4));let txt=f.content;if(f.truncated||txt==null){txt=await (await fetch(f.raw_url,{cache:"no-store"})).text()}
      const i=txt.indexOf("|"),ts=+txt.slice(0,i);
      if(!cloud||ts>cloud.ts)cloud={name,ts,txt:txt.slice(i+1)}}
    const pending=nm&&loc0>sy0;
    // a nuvem mudou desde a última sincronização deste aparelho (comparação por carimbo, sem depender do relógio)
    const changed=cloud&&(+localStorage.getItem(SYK+cloud.name)||0)!==cloud.ts;
    if(pending&&(!changed||cloud.name!==nm||loc0>=cloud.ts)){clearTimeout(_pt);await syncPush(nm);return}
    if(changed){localStorage.setItem(PREFIX+cloud.name,await ungz(cloud.txt));localStorage.setItem(TSK+cloud.name,cloud.ts);localStorage.setItem(SYK+cloud.name,cloud.ts);localStorage.setItem("elifoot:last",cloud.name);const tb=tab;loadSave(cloud.name);toast("☁️ Save mais novo baixado da nuvem",2500);if(tb)tab=tb,render()}
    syncSt("☁️ Conferido às "+new Date().toLocaleTimeString("pt-BR"));
  }catch(e){clearTimeout(_sr);_sr=setTimeout(()=>syncWatch(true),5000)}finally{_sb=false}
}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")syncWatch();else{const nm=S&&S.saveName;if(nm&&gcfg()&&(+localStorage.getItem(TSK+nm)||0)>(+localStorage.getItem(SYK+nm)||0)){clearTimeout(_pt);syncPush(nm)}}});
window.addEventListener("focus",syncWatch);setInterval(syncWatch,60000);
async function syncDelete(name){const c=gcfg();if(!c||!c.id)return;try{await gapi("/gists/"+c.id,"PATCH",{files:{[fname(name)]:null}})}catch(e){}}
// baixa saves mais novos da nuvem e envia os que só existem aqui; devolve quantos vieram da nuvem
async function syncPull(force){
  const c=gcfg();if(!c)return 0;
  if(!c.id){const l=await gapi("/gists?per_page=100");const g=l.find(x=>x.description===GDESC);
    if(g)c.id=g.id;else{const n=await gapi("/gists","POST",{description:GDESC,public:false,files:{"LEIA-ME.txt":{content:"Saves do Elifoot (comprimidos)."}}});c.id=n.id}gset(c)}
  const g=await gapi("/gists/"+c.id);let got=0,cmax=0;const seen=new Set();
  for(const f of Object.values(g.files)){
    if(!f.filename.startsWith("save-"))continue;
    const name=decodeURIComponent(f.filename.slice(5,-4));seen.add(name);
    let txt=f.content;if(f.truncated||txt==null){txt=await (await fetch(f.raw_url)).text()}
    const i=txt.indexOf("|"),ts=+txt.slice(0,i),loc=+localStorage.getItem(TSK+name)||0;cmax=Math.max(cmax,ts);
    if(force||ts>loc||!localStorage.getItem(PREFIX+name)){localStorage.setItem(PREFIX+name,await ungz(txt.slice(i+1)));localStorage.setItem(TSK+name,ts);localStorage.setItem(SYK+name,ts);if(!localStorage.getItem("elifoot:last"))localStorage.setItem("elifoot:last",name);got++}
  }
  for(const n of listSaves())if(!seen.has(n))await syncPush(n);
  newest();const fd=t=>t?new Date(t).toLocaleString("pt-BR"):"nenhum";syncSt(`☁️ Conferido às ${new Date().toLocaleTimeString("pt-BR")} · save na nuvem: ${fd(cmax)} · neste aparelho: ${fd(+localStorage.getItem(TSK+(localStorage.getItem("elifoot:last")||""))||0)}`);return got;
}
function newest(){let b=null,bt=-1;for(const n of listSaves()){const t=+localStorage.getItem(TSK+n)||0;if(t>bt){bt=t;b=n}}if(b)localStorage.setItem("elifoot:last",b);return b}
async function syncOn(){
  const t=$("gtok").value.trim();if(!t){alert("Cole o token.");return}
  gset({token:t});
  try{const n=await syncPull();msg=`Sincronização ativada. ${n} save(s) baixado(s) da nuvem.`;S=null;const last=localStorage.getItem("elifoot:last");if(last&&localStorage.getItem(PREFIX+last))loadSave(last);else render()}
  catch(e){localStorage.removeItem(GK);alert("Não consegui ativar: "+e.message+". Confira se o token tem permissão de gist.")}
}
function syncOff(){if(confirm("Desativar a sincronização neste aparelho? Os saves ficam aqui e na nuvem."))localStorage.removeItem(GK),render()}
async function syncNow(){try{const nm=S.saveName,n=await syncPull();if(n){loadSave(localStorage.getItem("elifoot:last")||nm);syncSt("☁️ Save mais novo baixado da nuvem.")}else{await syncPush(nm);render()}}catch(e){syncSt("Falha: "+e.message)}}
async function syncForce(){if(!confirm("Baixar da nuvem e SUBSTITUIR o save deste aparelho?"))return;try{await syncPull(true);const nm=localStorage.getItem("elifoot:last");if(nm&&localStorage.getItem(PREFIX+nm))loadSave(nm);else render()}catch(e){syncSt("Falha: "+e.message)}}
function syncCard(){
  const c=gcfg();
  if(c)return `<div class="card"><h2>Sincronização</h2><p class="mut" id="syncSt">${SYNCST||"☁️ Ativada neste aparelho."}</p><p class="mut">Cada save é enviado à nuvem ao salvar e baixado ao abrir o jogo. Vale o mais recente. Não jogue nos dois aparelhos ao mesmo tempo.</p><div class="row"><button class="p" onclick="syncNow()">Sincronizar agora</button><button class="s" onclick="syncForce()">Baixar da nuvem</button><button class="s d" onclick="syncOff()">Desativar</button></div></div>`;
  return `<div class="card"><h2>Sincronizar celular e computador</h2><p class="mut">Cole o token do GitHub (permissão só de gist). Nada para instalar. Faça o mesmo em cada aparelho.</p><div class="row"><input id="gtok" type="password" placeholder="ghp_... ou github_pat_..." style="flex:1;min-width:0"><button class="p" onclick="syncOn()">Ativar</button></div></div>`;
}

const ZCOL={LIB:"#2f7de1",UCL:"#2f7de1",SUL:"#f0a020",UEL:"#f0a020",UECL:"#2ab7a9",ACE:"#3ddc84",REB:"#ff6b6b"};
function zonas(c){
  if(!c||c.after!=="lg"||!c.key)return null;const lg=Game.LEAGUES.find(l=>l.key===c.key);if(!lg)return null;
  const n=c.ids.length,z={},leg=[];
  const add=(a,b,k,lab)=>{b=Math.min(b,n);if(a>b)return;for(let p=a;p<=b;p++)z[p]=ZCOL[k];leg.push([ZCOL[k],a===b?`${a}º`:`${a}º ao ${b}º`,lab])};
  for(const k of ["LIB","UCL","SUL","UEL","UECL"]){const d=Game.CONT[k];if(!d)continue;for(const [lk,a,b] of d.slots)if(lk===c.key)add(a,b,k,d.name)}
  const pr=Game.COUNTRIES[lg.country].promo||0;
  if(lg.tier>1&&pr)add(1,pr,"ACE","Acesso");
  if(pr&&Game.LEAGUES.some(l=>l.country===lg.country&&l.tier===lg.tier+1))add(n-pr+1,n,"REB","Rebaixamento");

// Chaveamento do mata-mata: uma coluna por fase (da mais antiga à atual) e o campeão no fim
function bracket(c,T,mi){
  const stages=(T.past||[]).map(p=>({name:p.name,ties:p.ties})).concat([{name:T.stage,ties:T.ties}]);
  const sc=(t,side)=>{let g=0,n=0;t.res.forEach((r,k)=>{n++;g+=(k%2===0)===(side===0)?r[0]:r[1]});return n?g:null};
  const row=(t,side)=>{
    const id=side?t.b:t.a,g=sc(t,side),w=t.w!==null&&t.w!==undefined?(t.w===id?"w":"l"):"",m=mi.includes(id);
    const legs=t.legs===2&&t.res.length?` <span class="mut" style="font-size:11px">(${t.res.map((r,k)=>(k%2===0)===(side===0)?r[0]:r[1]).join("·")})</span>`:"";
    const pk=t.pens&&t.pk?` <span class="mut" style="font-size:11px">(${t.pk[side]})</span>`:"";
    return `<div class="${w}">${tbox(S.teams[id].name)}<span style="font-size:18px;font-weight:800;white-space:nowrap">${m?"★ ":""}${g===null?"":g}${t.legs===2?legs:""}${pk}</span></div>`};
  const col=st=>{const one=t=>{const m=mi.includes(t.a)||mi.includes(t.b);return `<div class="bt${m?" m":""}">${row(t,0)}${row(t,1)}</div>`};
    const grp=(T.mode==="tree"||T.mode==="uefa")&&st.name!=="Playoff"&&st.ties.length>1&&st.ties.length%2===0; // confrontos vizinhos (1 e 2, 3 e 4...) se enfrentam na fase seguinte
    let b="";if(grp){for(let i=0;i<st.ties.length;i+=2)b+=`<div class="bp">${one(st.ties[i])}${one(st.ties[i+1])}</div>`}else b=st.ties.map(one).join("");
    return `<div class="bc"><div class="bh">${st.name}</div><div class="bl">${b}</div></div>`};
  const oneT=t=>{const m=mi.includes(t.a)||mi.includes(t.b);return `<div class="bt${m?" m":""}">${row(t,0)}${row(t,1)}</div>`};
  const phB=`<div class="bt"><div><span class="mut">A definir</span></div><div><span class="mut">A definir</span></div></div>`;
  const champ=T.champion!==null&&T.champion!==undefined&&T.champion!==false?`<div class="bc"><div class="bh">Campeão</div><div class="bl"><div class="bt m" style="text-align:center;padding:14px 8px"><div style="font-size:34px;justify-content:center">🏆</div><div style="justify-content:center">${tbox(S.teams[T.champion].name)}</div></div></div></div>`:"";
  let desk="";
  if((T.mode==="tree"||T.mode==="uefa")&&T.plan){
    const ts=stages.filter(x=>!(T.mode==="uefa"&&x.name==="Playoff")),pl=stages.find(x=>T.mode==="uefa"&&x.name==="Playoff");
    const names=T.plan.map(p=>p.name),i0=ts.length?names.indexOf(ts[0].name):-1;
    if(i0>=0){
      const nm=names.slice(i0),levels=nm.map((n,i)=>{const st=ts.find(x=>x.name===n);return st?st.ties:Array.from({length:Math.max(1,Math.round(ts[0].ties.length/Math.pow(2,i)))},()=>null)});
      let ok=levels[levels.length-1].length===1;for(let i=1;i<levels.length&&ok;i++)if(levels[i].length*2!==levels[i-1].length)ok=false;
      if(ok){
        const node=(l,i)=>`<div class="bn">${l>0?`<div class="bk">${node(l-1,2*i)}${node(l-1,2*i+1)}</div>`:""}${levels[l][i]?oneT(levels[l][i]):phB}</div>`;
        const ch=T.champion!==null&&T.champion!==undefined&&T.champion!==false;
        desk=`<div class="brk2"><div class="tr2">${pl?`<div class="pl0"><div class="trh1">Playoff</div>${pl.ties.map(oneT).join("")}</div>`:""}<div class="trc"><div class="trh">${nm.map(n=>`<div>${n}</div>`).join("")}${ch?"<div>Campeão</div>":""}</div><div class="trt">${node(levels.length-1,0)}${ch?`<div class="bt m" style="text-align:center;padding:14px 8px;margin-left:14px;width:200px"><div style="font-size:34px;justify-content:center">🏆</div><div style="justify-content:center">${tbox(S.teams[T.champion].name)}</div></div>`:""}</div></div></div></div>`;
      }
    }
  }
  return `<div class="card wide"><h2>${c.name} — Mata-mata</h2><p class="mut" style="margin:0 0 6px;font-size:12px">${T.mode==="tree"||T.mode==="uefa"?"Os vencedores de cada par de confrontos (mesmo bloco) se enfrentam na fase seguinte.":"Sorteio livre a cada fase."}</p><div class="brk${desk?" has2":""}"><img src="data:," alt="" style="display:none" onerror="this.parentNode.scrollLeft=1e5;this.remove()">${stages.map(col).join("")}${champ}</div>${desk}</div>`;
}

function vFin(){
  const l=(S.ledger||[]).filter(x=>x.id===S.user).slice().reverse(),rec=l.reduce((a,x)=>a+(x.v>0?x.v:0),0),pag=l.reduce((a,x)=>a+(x.v<0?-x.v:0),0);
  return `<div class="card"><h2>Histórico financeiro — ${U().name}</h2><p>Caixa atual: <b>${moneyFull(S.cash)}</b><br><span class="good">Recebido: ${moneyFull(rec)}</span> · <span class="bad">Pago: ${moneyFull(pag)}</span></p><button class="s" onclick="FINH=false;render()">← Voltar</button></div>
  <div class="card">${l.length?l.map(x=>`<div class="pl"><span>${Game.dateOf(x.T)}<br><span class="mut">${x.d}</span></span><b class="${x.v>=0?"good":"bad"}" style="text-align:right">${x.v>=0?"+":"-"}${moneyFull(Math.abs(x.v))}</b></div>`).join(""):'<p class="mut">Ainda não há movimentações.</p>'}</div>`;
}
function vMais(){
  if(FINH)return vFin();
  const u=U(),w=u.players.reduce((s,p)=>s+p.wage,0);
  return `<div class="elg mcg"><div class="mc"><div class="card"><h2>Finanças</h2><p>Caixa: <b>${moneyFull(S.cash)}</b><br>Receita anual estimada: ${money(Game.clubRev(u))} <span class="mut">(TV, patrocínio e bilheteria)</span><br>Folha mensal: ${money(Math.round(Game.payroll(u)/12))} <span class="mut">(paga uma vez por mês)</span><br>Torcida (estimada): ${(u.fans*1000).toLocaleString("pt-BR")}<br>Reputação: ${S.rep}/100</p><button class="s" onclick="FINH=true;render()">📒 Histórico financeiro</button></div>
  <div class="card"><h2>Ofertas de emprego</h2>
  ${myS().map(id=>{const m=(S.jobModes&&S.jobModes[id]!=null?S.jobModes[id]:S.jobMode)||"";return `<div style="border-bottom:1px solid var(--line);padding:6px 0"><b>${S.teams[id].name}</b> <span class="mut">(${Game.COUNTRIES[S.teams[id].country].name})</span>
  <label style="display:flex;gap:8px;align-items:center;padding:3px 0"><input type="checkbox" ${m==="refuse"?"checked":""} onchange="setJob(${id},'refuse',this.checked)" style="padding:0;width:20px;height:20px"> Recusar ofertas de emprego</label>
  <label style="display:flex;gap:8px;align-items:center;padding:3px 0"><input type="checkbox" ${m==="seek"?"checked":""} onchange="setJob(${id},'seek',this.checked)" style="padding:0;width:20px;height:20px"> Procurando emprego (ofertas a cada 5 jogos)</label></div>`}).join("")}
  <p class="mut">Vale para cada clube separadamente. Sem nenhuma marcada, chegam ofertas a cada 10 jogos. Os convites são de clubes maiores que o clube (pelo valor do elenco), desde que a posição atual na tabela seja compatível com o porte do clube. Nunca de divisão inferior, nem em outro país. Se você aceitar, o convite substitui aquele clube.</p></div></div><div class="mc">
  <div class="card"><h2>Estádio</h2>${(()=>{const cap=Game.getStad(u),max=cap>=100000;return `<p>Capacidade: <b>${cap.toLocaleString("pt-BR")}</b> lugares${max?" (máximo)":""}<br><span class="mut">Mínimo 10.000 · máximo 100.000 · amplia de 10.000 em 10.000. Custo: capacidade atual × 100. O ingresso é mais caro em competições e fases mais importantes. A renda do jogo é toda do mandante; o visitante não recebe nada. O público depende da torcida (${(u.fans*1000).toLocaleString("pt-BR")}).</span></p>${max?"":`<p><button class="p" onclick="buildStad()">Ampliar para ${(cap+10000).toLocaleString("pt-BR")} lugares (${moneyFull(Game.stadCost(u))})</button></p>`}`})()}</div>
  <div class="card"><h2>Meus times</h2>${myS().map(id=>`<div class="pl ${id===S.user?"in":""}"><span><b>${S.teams[id].name}</b> <span class="mut">(${Game.COUNTRIES[S.teams[id].country].name})</span><br><span class="mut">Caixa ${moneyFull(id===S.user?S.cash:(S.cashes&&S.cashes[id])||0)}${id===S.user?" · ativo":""}</span></span><span>${id===S.user?"":`<button class="s p" onclick="swClub(${id})">Comandar</button> `}<button class="s d" onclick="dropClubUI(${id})">Largar</button></span></div>`).join("")}
  <div class="row" style="margin-top:8px"><select id="addSel" style="flex:1;min-width:0">${clubOpts()}</select><button class="p" onclick="addClubUI()">Adicionar time</button></div>
  <div class="row" style="margin-top:8px"><select id="addCty" style="flex:1;min-width:0"><option value="">Qualquer país</option>${cNames().map(n=>`<option>${n}</option>`).join("")}</select><button onclick="addRandomUI()">🎲 Time aleatório</button></div>
  <p class="mut">Cada time tem elenco, escalação e caixa próprios. O jogo avança até a próxima partida do time ativo; os outros times seus jogam com escalação automática se ela ficar inválida e pagam salários e recebem bilheteria. Prêmios e propostas de fim de temporada só valem para o time ativo.</p></div></div><div class="mc">
  ${syncCard()}
  <div class="card"><h2>Save e elencos</h2><p class="mut">Salvamento automático em um único save para todos os seus times.</p>
  <div class="row"><button onclick="exportSave()">Exportar save</button><button onclick="start()">Trocar de save / novo jogo</button></div>
  <p class="mut">Os elencos são atualizados automaticamente ao abrir o jogo. Todos os times são atualizados, exceto o seu. O seu elenco nunca é alterado enquanto você for o técnico; jogadores que você vendeu ficam no clube comprador.</p>${msg?`<p>${msg}</p>`:""}</div></div></div>`;
}
async function update(auto){
  try{const r=await fetch("elencos.json?"+Date.now());if(!r.ok)throw 0;const d=await r.json();try{const rn=await fetch("notas.json?"+Date.now());if(rn.ok)d.notas=await rn.json()}catch(e){}
    const stamp=(d.updated||"")+"|"+((d.notas&&d.notas.v)||"")+"|p5";
    if(auto&&d.updated&&S.lastUpd===stamp&&(S.ext||!d.outros))return;
    const tsPrev=localStorage.getItem(TSK+S.saveName),x=Game.applyUpdate(S,d);S.lastUpd=stamp;msg=`Elencos atualizados (${d.updated||"?"}): ${x.teams} times, ${x.kept} jogadores vendidos mantidos nos compradores.`+(x.left.length?`<br>Saíram do seu time (transferência real): ${x.left.join("; ")}`:"");save();if(auto&&tsPrev){clearTimeout(_pt);localStorage.setItem(TSK+S.saveName,tsPrev)}}
  catch(e){if(!auto)msg="Ainda não há elencos.json publicado."}
  if(S)render();
}
async function updLigas(){try{if(!S)return;const r=await fetch("ligas.json?"+Date.now());if(!r.ok)return;const d=await r.json();const x=Game.applyLeagues(S,d);if(x.length){const t=x.map(e=>e.error?`${e.country}: ${e.error}`:`${Game.COUNTRIES[e.country].name}: ${e.moves.length?e.moves.join("; "):"nenhuma mudança"}`).join("<br>");msg=`Divisões atualizadas pela vida real:<br>${t}`;save();render()}}catch(e){}}
function boot(){try{const last=localStorage.getItem("elifoot:last");if(last&&localStorage.getItem(PREFIX+last))loadSave(last);else render()}catch(e){render()}
if(S){update(true);updLigas()}}
if(gcfg()){$("app").innerHTML='<div class="card"><p>☁️ Sincronizando saves...</p></div>';syncPull().catch(e=>syncSt("Falha: "+e.message)).finally(boot)}else boot();
// // atualiza sozinho ao abrir, se houver elencos.json novo
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
