.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}

button.p{background:var(--ac);color:var(--onac);font-weight:700;border:0}
button.s{padding:6px 10px;font-size:13px}
button.d{background:#4a1f1f}

table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:5px 4px;text-align:right;border-bottom:1px solid var(--line)}
th:first-child,td:first-child,td.l,th.l{text-align:left}
tr.me{background:var(--hl);font-weight:700}
.z1{border-left:3px solid var(--ac)}.z2{border-left:3px solid var(--bad)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pos{display:inline-block;width:38px;font-size:11px;color:var(--mut)}

.campo:before{content:"";position:absolute;left:0;right:0;top:50%;border-top:2px solid #fff8}
.campo:after{content:"";position:absolute;left:50%;top:50%;width:70px;height:70px;margin:-35px 0 0 -35px;border:2px solid #fff8;border-radius:50%}
.lin.dup{justify-content:center;gap:14%}
.lin{display:flex;justify-content:space-around;align-items:center;position:relative;z-index:1}

<script>
const PREFIX="elifoot:save:";
let S=null,tab="jogo",msg="",mf={pos:"",q:"",min:0},viewKey=null;
const $=id=>document.getElementById(id);
const VERSAO=14;
const moneyFull=n=>(n<0?"-":"")+"R$ "+Math.round(Math.abs(n)).toLocaleString("pt-BR");

const U=()=>S.teams[S.user];
const LGu=()=>Game.LG[U().lkey];

// ---- salvamento automático com o nome do time (mesmo nome = sobrescreve) ----
function save(){
  try{if(!S.saveName)S.saveName=U().name;localStorage.setItem(PREFIX+S.saveName,JSON.stringify(S));localStorage.setItem("elifoot:last",S.saveName)}
  catch(e){alert("Sem espaço no aparelho para salvar. Apague saves antigos na tela inicial.")}
}
function listSaves(){const r=[];for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k.startsWith(PREFIX))r.push(k.slice(PREFIX.length))}return r.sort()}
function loadSave(name){try{S=JSON.parse(localStorage.getItem(PREFIX+name));Game.resetPid(S);viewKey=null;tab="jogo";msg="";localStorage.setItem("elifoot:last",name);render()}catch(e){console.error(e);if(S&&typeof Game.bestFormation!=="function"){alert("Versão antiga do jogo em cache. Recarregue a página (Ctrl+F5) e abra o save de novo.")}else alert("Erro ao abrir o save: "+(e&&e.message||e))}}
function delSave(name){if(confirm("Apagar o save de "+name+"?")){localStorage.removeItem(PREFIX+name);start()}}

function clubOpts(){let sel="";const opts=Game.COUNTRIES;for(const c in opts){const ls=Game.LEAGUES.filter(l=>l.country===c);sel+=`<optgroup label="${opts[c].name}">`+ls.map(l=>l.clubs.map(n=>`<option value="${n}">${n} (${l.name})</option>`).join("")).join("")+`</optgroup>`}return sel}
function tidByName(n){return +Object.keys(S.teams).find(k=>S.teams[k].name===n)}
function swClub(id){const e=Game.switchClub(S,id);if(e)alert(e);viewKey=null;tab="jogo";msg="";save();render()}
function addClubUI(){const n=$("addSel").value,id=tidByName(n);if(!id&&id!==0){alert("Time não encontrado.");return}const e=Game.addClub(S,id);if(e){alert(e);return}msg=`Agora você também comanda ${n}. Use "Comandar" para trocar de time.`;save();render()}
function dropClubUI(id){if(!confirm("Largar este time?"))return;const e=Game.dropClub(S,id);if(e)alert(e);save();render()}
function start(){applyTheme(null);
  S=null;
  const saves=listSaves();
  const opts=Game.COUNTRIES;
  let sel="";
  for(const c in opts){
    const ls=Game.LEAGUES.filter(l=>l.country===c);

  }
  $("app").innerHTML=`<div class="card"><h2>Continuar</h2>${saves.length?saves.map(n=>`<div class="pl"><span>${n}</span><span><button class="s p" onclick="loadSave('${n.replace(/'/g,"\\'")}')">Abrir</button> <button class="s d" onclick="delSave('${n.replace(/'/g,"\\'")}')">X</button></span></div>`).join(""):'<p class="mut">Nenhum save ainda.</p>'}</div>
  <div class="card"><h2>Novo jogo</h2><p class="mut">8 países, 2 a 3 divisões cada, copas continentais. Elencos do protótipo são <b>estimados</b>, não reais. Se já existir save com o nome do time escolhido, ele é sobrescrito.</p>
  <div class="row"><select id="clubSel" style="flex:1;min-width:0">${sel}</select><button class="p" onclick="go()">Começar</button></div>

  <div class="card"><label class="mut">Importar save (.json)</label><br><input type="file" accept=".json" onchange="importSave(event)"></div>`;
  $("nav").innerHTML="";$("hT").textContent="Meu Elifoot";$("hS").textContent="";$("crest").innerHTML="";$("flag").innerHTML="";
}
const TEAM_COLORS={"Flamengo":"#c8102e","Palmeiras":"#006437","Botafogo":"#2b2b2b","Fluminense":"#7a1f3d","Vasco":"#1a1a1a","Corinthians":"#2b2b2b","São Paulo":"#d6001c","Santos":"#2b2b2b","Grêmio":"#0d80bf","Internacional":"#e5050f","Cruzeiro":"#1c4fa3","Atlético-MG":"#2b2b2b","Bahia":"#1f5fbf","Athletico-PR":"#c8102e","Bragantino":"#c8102e","Vitória":"#c8102e","Mirassol":"#e8b800","Coritiba":"#00553a","Chapecoense":"#00843d","Fortaleza":"#1c4fa3","Ceará":"#2b2b2b","Sport":"#c8102e","Goiás":"#00793d","Avaí":"#1c5fb0","Novorizontino":"#e8b800","Criciúma":"#e8b800","Cuiabá":"#00793d","Juventude":"#00793d","Operário-PR":"#2b2b2b","Vila Nova":"#c8102e","CRB":"#c8102e","Athletic-MG":"#c8102e","América-MG":"#00793d","Ponte Preta":"#2b2b2b","Botafogo-SP":"#c8102e","Londrina":"#1c5fb0","Atlético-GO":"#c8102e","Náutico":"#c8102e","São Bernardo":"#e8b800","Figueirense":"#2b2b2b","Santa Cruz":"#c8102e","Brusque":"#c8102e","Volta Redonda":"#e8b800","Guarani":"#00793d","ABC":"#2b2b2b","Paysandu":"#1c5fb0","Ferroviária":"#7a1f3d","Remo":"#1c4fa3","River Plate":"#c8102e","Boca Juniors":"#0b3a8c","Racing Club":"#4aa3df","Independiente":"#c8102e","San Lorenzo":"#1c3f8f","Estudiantes LP":"#c8102e","Vélez Sarsfield":"#1c4fa3","Talleres":"#1c3f8f","Lanús":"#7a1f3d","Argentinos Juniors":"#c8102e","Rosario Central":"#e8b800","Newell's Old Boys":"#c8102e","Huracán":"#c8102e","Belgrano":"#4aa3df","Gimnasia LP":"#1c3f8f","Banfield":"#00793d","Tigre":"#1c3f8f","Godoy Cruz":"#1c3f8f","Colón":"#c8102e","Quilmes":"#4aa3df","Chacarita":"#c8102e","Liverpool":"#c8102e","Arsenal":"#d6001c","Manchester City":"#6cabdd","Chelsea":"#034694","Newcastle":"#2b2b2b","Aston Villa":"#670e36","Nottingham Forest":"#c8102e","Brighton":"#0057b8","Bournemouth":"#c8102e","Brentford":"#d6001c","Fulham":"#2b2b2b","Crystal Palace":"#1b458f","Everton":"#003399","West Ham":"#7a263a","Tottenham":"#132257","Manchester United":"#da291c","Wolverhampton":"#fdb913","Sunderland":"#d6001c","Leeds United":"#e8c500","Burnley":"#6c1d45","Leicester":"#0053a0","Southampton":"#d71920","Ipswich":"#0044aa","West Bromwich":"#122f67","Norwich":"#00a650","Sheffield United":"#ee2737","Sheffield Wednesday":"#0e4ca1","Middlesbrough":"#d6001c","Coventry":"#6cc4e8","Stoke City":"#e03a3e","Swansea":"#2b2b2b","Watford":"#fbee23","Bristol City":"#e21a22","Millwall":"#001d5c","Preston":"#1c3f8f","Blackburn":"#0f5fb4","QPR":"#1d5ba4","Hull City":"#f5a11c","Derby County":"#2b2b2b","Portsmouth":"#001c8c","Oxford United":"#f2c200","Birmingham City":"#0e3b9c","Charlton":"#d6001c","Wrexham":"#d6001c","Real Madrid":"#3b4a8c","Barcelona":"#a50044","Atlético de Madrid":"#c8102e","Athletic Bilbao":"#c8102e","Real Sociedad":"#0067b1","Villarreal":"#f2c200","Betis":"#00954c","Sevilla":"#d6001c","Valencia":"#2b2b2b","Girona":"#c8102e","Celta de Vigo":"#6cc4e8","Osasuna":"#c8102e","Getafe":"#005999","Rayo Vallecano":"#c8102e","Mallorca":"#c8102e","Alavés":"#1c4fa3","Espanyol":"#1c5fb0","Levante":"#a50044","Elche":"#00793d","Real Oviedo":"#1c4fa3","Benfica":"#c8102e","Porto":"#0a3d91","Sporting CP":"#00793d","Braga":"#c8102e","Vitória de Guimarães":"#2b2b2b","Famalicão":"#1c4fa3","Estoril":"#f2c200","Gil Vicente":"#c8102e","Inter de Milão":"#0b3a8c","Milan":"#c8102e","Juventus":"#2b2b2b","Napoli":"#0e8fd6","Atalanta":"#1c4fa3","Roma":"#8e1f2f","Lazio":"#6cc4e8","Fiorentina":"#5b2a86","Bologna":"#a50034","Torino":"#8e1f2f","Udinese":"#2b2b2b","Genoa":"#a50034","Cagliari":"#a50034","Como":"#1c4fa3","Parma":"#f2c200","Lecce":"#e8b800","Verona":"#1c4fa3","Sassuolo":"#00793d","Pisa":"#1c4fa3","Cremonese":"#a50034","Bayern de Munique":"#dc052d","Borussia Dortmund":"#fde100","Bayer Leverkusen":"#e32219","RB Leipzig":"#dd0741","Eintracht Frankfurt":"#2b2b2b","VfB Stuttgart":"#e32219","Borussia Mönchengladbach":"#00793d","Werder Bremen":"#1d9053","Wolfsburg":"#65b32e","Freiburg":"#c8102e","Hoffenheim":"#1961b5","Mainz 05":"#c3141e","Augsburg":"#ba3733","Union Berlin":"#eb1923","St. Pauli":"#6b3b1f","Heidenheim":"#e2001a","Colônia":"#ed1c24","Hamburgo":"#005ca9","Schalke 04":"#004d9d","PSG":"#004170","Marseille":"#2eb4e6","Monaco":"#e51c2a","Lille":"#d6001c","Lyon":"#1c3f8f","Nice":"#c8102e","Lens":"#e8b800","Rennes":"#c8102e","Strasbourg":"#0a58ca","Brest":"#c8102e","Toulouse":"#6a2c91","Nantes":"#e8b800","Saint-Étienne":"#00793d","Ajax":"#d2122e","PSV":"#d6001c","Club Brugge":"#1c4fa3","Galatasaray":"#e8a000","Celtic":"#00793d","Feyenoord":"#d6001c","Fenerbahçe":"#1b2a6b","Besiktas":"#2b2b2b","Rangers":"#1b458f","Anderlecht":"#5b2a86","Shakhtar Donetsk":"#f58220","Dínamo de Kiev":"#1c4fa3","Red Bull Salzburg":"#d6001c","Basel":"#c8102e","Estrela Vermelha":"#c8102e","Olympiacos":"#d6001c","Panathinaikos":"#00793d","PAOK":"#2b2b2b","AEK Atenas":"#e8b800","Dinamo Zagreb":"#1c4fa3","Legia Varsóvia":"#00793d","Trabzonspor":"#7a1f3d","Peñarol":"#e8b800","Nacional-URU":"#1c3f8f","Colo-Colo":"#2b2b2b","Universidad Católica":"#1c4fa3","Atlético Nacional":"#00793d","Junior":"#c8102e","LDU Quito":"#2b2b2b","Barcelona SC":"#e8b800","Independiente del Valle":"#1c4fa3","Olimpia":"#2b2b2b","Cerro Porteño":"#1c3f8f","Libertad":"#2b2b2b","Bolívar":"#4aa3df","The Strongest":"#e8b800","Alianza Lima":"#1c3f8f","Universitario":"#7a1f3d","Sporting Cristal":"#4aa3df","Universidad de Chile":"#1c3f8f","Millonarios":"#1c3f8f","América de Cali":"#c8102e","Emelec":"#1c3f8f","Portuguesa":"#c8102e","Madureira":"#e8b800","Bangu":"#c8102e","Ferroviário":"#c8102e","Joinville":"#c8102e","Marcílio Dias":"#1c4fa3","Caxias":"#7a1f3d","Ypiranga-RS":"#e8b800","Tombense":"#c8102e","Juazeirense":"#1c4fa3","Maringá":"#e8b800","Toledo":"#1c4fa3","Cianorte":"#1c4fa3"};
function mixc(a,b,t){return a.map((v,i)=>Math.round(v+(b[i]-v)*t))}
function hx(c){return"#"+c.map(v=>v.toString(16).padStart(2,"0")).join("")}
function themeFor(name){let h=TEAM_COLORS[name];if(!h){let n=0;for(const ch of name)n=(n*31+ch.charCodeAt(0))%360;const f=(k)=>{const a=((n/60+k)%6),x=Math.max(0,Math.min(1,Math.abs(a-3)-1));return Math.round(255*(0.55+0.45*(1-x))*0.8)};h=hx([f(0),f(4),f(2)])}
 const c=[1,3,5].map(i=>parseInt(h.substr(i,2),16)),K=[0,0,0],W=[255,255,255];
 return{bg:hx(mixc(c,K,.82)),card:hx(mixc(c,K,.72)),line:hx(mixc(c,K,.55)),hd:hx(mixc(c,K,.4)),btn:hx(mixc(c,K,.6)),hl:hx(mixc(c,K,.5)),ac:hx(mixc(c,W,.45)),hdt:hx(mixc(c,W,.75)),mut:hx(mixc(c,W,.6)),onac:hx(mixc(c,K,.85))}}
function applyTheme(name){const r=document.documentElement.style;if(!name){["--bg","--card","--line","--hd","--btn","--hl","--ac","--hdt","--mut","--onac"].forEach(k=>r.removeProperty(k));document.querySelector('meta[name=theme-color]').content="#0b3d1e";return}
 const t=themeFor(name);r.setProperty("--bg",t.bg);r.setProperty("--card",t.card);r.setProperty("--line",t.line);r.setProperty("--hd",t.hd);r.setProperty("--btn",t.btn);r.setProperty("--hl",t.hl);r.setProperty("--ac",t.ac);r.setProperty("--hdt",t.hdt);r.setProperty("--mut",t.mut);r.setProperty("--onac",t.onac);document.querySelector('meta[name=theme-color]').content=t.hd}
const FLAGS={
BRA:'<rect width="30" height="20" fill="#009c3b"/><path d="M15 2 28 10 15 18 2 10z" fill="#ffdf00"/><circle cx="15" cy="10" r="4.2" fill="#002776"/>',
ARG:'<rect width="30" height="20" fill="#74acdf"/><rect y="6.7" width="30" height="6.6" fill="#fff"/><circle cx="15" cy="10" r="1.6" fill="#f6b40e"/>',

ENG:'<rect width="30" height="20" fill="#fff"/><rect x="12.5" width="5" height="20" fill="#ce1124"/><rect y="7.5" width="30" height="5" fill="#ce1124"/>',

FRA:'<rect width="10" height="20" fill="#002395"/><rect x="10" width="10" height="20" fill="#fff"/><rect x="20" width="10" height="20" fill="#ed2939"/>'};
function flagSvg(c){return FLAGS[c]?`<svg width="30" height="20" viewBox="0 0 30 20">${FLAGS[c]}</svg>`:""}
let TMID={},SPMAP=null;fetch("elencos.json").then(r=>r.json()).then(d=>{SPMAP={};d.teams.forEach(t=>{if(t.tm)TMID[t.name]=t.tm;t.players.forEach(p=>{if(p.sp)SPMAP[t.name+"|"+p.name]=p.sp})});if(window.S&&typeof render==="function")render()}).catch(()=>{});
function crestFallback(im){const n=im.getAttribute("data-n");if(im.parentNode)im.parentNode.innerHTML=crestSvg0(n)}
function crestSvg(name){if(TMID[name])return `<img src="escudos/${TMID[name]}.png" alt="" data-n="${name.replace(/"/g,"")}" style="display:block;height:40px;width:auto;max-width:44px;object-fit:contain" onerror="crestFallback(this)">`;return crestSvg0(name)}
function crestSvg0(name){const t=themeFor(name),h=TEAM_COLORS[name]||t.ac;const w=name.replace(/[^A-Za-zÀ-ÿ ]/g,"").split(" ").filter(x=>x.length>1);const ini=((w[0]||name)[0]+((w[1]||"")[0]||(w[0]||name)[1]||"")).toUpperCase();
 const l=[1,3,5].map(i=>parseInt(h.substr(i,2),16)),lum=(0.3*l[0]+0.59*l[1]+0.11*l[2]),tx=lum>150?"#111":"#fff";
 return `<svg width="34" height="40" viewBox="0 0 34 40"><path d="M2 3h30v18c0 10-8 15-15 17C10 36 2 31 2 21z" fill="${h}" stroke="#fff" stroke-width="2"/><text x="17" y="24" text-anchor="middle" font-family="system-ui,sans-serif" font-weight="800" font-size="13" fill="${tx}">${ini}</text></svg>`}
function goRandom(){const c=$("rndSel").value,sel=$("clubSel");let o=[...sel.options];if(c)o=o.filter(x=>x.parentNode.label===c);const x=o[Math.floor(Math.random()*o.length)];sel.value=x.value;go()}
function go(){S=Game.newGame($("clubSel").value);viewKey=null;tab="jogo";msg="";save();render()}
function importSave(e){const f=e.target.files[0];if(!f)return;f.text().then(t=>{S=JSON.parse(t);Game.resetPid(S);save();render()})}
function exportSave(){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:"application/json"}));a.download="elifoot-"+U().name+".json";a.click()}

function setTab(t){tab=t;msg="";render()}
function autoBest(u){if(u.fAuto===false)return false;const b=Game.bestFormation(u);const same=u.formation===b.f&&u.lineup.length===b.ids.length&&b.ids.every(i=>u.lineup.includes(i));if(same)return false;u.formation=b.f;u.lineup=b.ids;return true}
function fixSP(){
  if(S&&S.teams&&S.teams[S.user]){const u=S.teams[S.user];if(Game.fixLineup(u)|autoBest(u))save()}
  if(S&&S.spv&&!S.lv5){Game.myClubs(S).forEach(id=>{S.teams[id].lineup=Game.autoLineup(S.teams[id])});S.lv5=1;save()}
  if(!S||S.spv||!SPMAP)return;
  const alt={GK:["GOL"],DEF:["ZAG","LD","ZAG","LE"],MID:["VOL","MC","ME","MD","MC"],ATT:["CA","PE","PD"]};
  for(const t of Object.values(S.teams)){let ch=0;
    for(const p of t.players){if(p.sp&&p.spv2)continue;
      const m=SPMAP[t.name+"|"+p.name];
      if(m){if(p.sp!==m){p.sp=m;ch=1}}
      else if(!p.sp||!p.spv2){const o=alt[p.pos]||["MC"];p.sp=o[p.id%o.length];ch=1}
      p.spv2=1}
    if(ch)t.lineup=Game.autoLineup(t)}
  S.spv=1;S.lv5=1;save()}
function render(){fixSP();
  if(!S)return start();
  const u=U();applyTheme(u.name);
  if(Game.myClubs(S).length>1)$("hT").innerHTML=`<select onchange="swClub(this.value)" style="background:transparent;color:inherit;font:inherit;font-weight:700;border:0;max-width:210px">${Game.myClubs(S).map(id=>`<option value="${id}" ${id===S.user?"selected":""}>${S.teams[id].name}</option>`).join("")}</select>`;else $("hT").textContent=u.name;
  $("crest").innerHTML=crestSvg(u.name);$("flag").innerHTML=flagSvg(u.country);
  $("hS").innerHTML=`${Game.COUNTRIES[u.country].name} · ${(Object.values(S.comps).find(c=>c.key===u.lkey)||{name:""}).name||""}\n<span class="cx">Caixa ${moneyFull(S.cash)}</span>\n${Game.dateOf(S.T)} · <span style="opacity:.6;font-size:10px">versão ${VERSAO}</span>`;
  const tabs=[["jogo","Jogo"],["elenco","Elenco"],["tabela","Tabela"],["mercado","Mercado"],["fin","Mais"]];
  $("nav").innerHTML=tabs.map(([k,n])=>`<button class="${tab===k?"on":""}" onclick="setTab('${k}')">${n}</button>`).join("");
  $("app").innerHTML=({jogo:vJogo,elenco:vElenco,tabela:vTabela,mercado:vMercado,fin:vMais})[tab]();
  window.scrollTo(0,0);
}

function vJogo(){
  const u=U();let h="";
  if(S.offers&&S.offers.length){
    h+=`<div class="card"><h2>Convites de outros clubes</h2><p class="mut">Sua reputação: ${S.rep}/100. Se aceitar, você assume o novo clube (com o caixa dele) e o time atual segue com a IA.</p>`+
    S.offers.map(o=>`<div class="pl"><span>${o.name}<br><span class="mut">${o.league} · ${o.country} · OVR ${o.ovr}${o.why?"<br>"+o.why:""}</span></span><button class="s p" onclick="accept(${o.tid})">Aceitar</button></div>`).join("")+
    `<p><button class="s" onclick="S.offers=[];save();render()">Recusar todos</button></p></div>`;
  }
  const n=Game.nextUserRound(S);
  h+=`<div class="card"><h2>Próxima partida</h2>`;
  if(n){
    h+=`<div class="big">${n.home.name} x ${n.away.name}</div><p class="mut" style="text-align:center">${n.date} · ${n.comp}<br>Seu OVR: ${Game.ratings(u).ovr.toFixed(1)} · Adversário: ${Game.ratings(n.home===u?n.away:n.home).ovr.toFixed(1)}</p>`;
  }else h+=`<p>Sem jogos agendados. Clique para avançar o calendário.</p>`;
  h+=`</div>`+lineupCard(u)+(msg?`<div class="card">${msg}</div>`:"");
  return h;
}
const SPN=p=>p.sp||({GK:"GOL",DEF:"ZAG",MID:"MC",ATT:"CA"})[p.pos];
const SPR={GOL:0,LD:1,ZAG:2,LE:3,VOL:4,ME:5,MC:6,MD:7,PD:8,PE:9,CA:10};
const SPO={LE:0,ZAG:1,LD:2,ME:0,VOL:1,MC:2,MD:3,PE:0,CA:1,PD:2,GOL:0};
function lineupCard(u){
  const set=new Set(u.lineup),order={GK:0,DEF:1,MID:2,ATT:3};
  const st=u.players.filter(p=>set.has(p.id)).sort((a,b)=>b.ov-a.ov);
  const res=u.players.filter(p=>!set.has(p.id)).sort((a,b)=>b.ov-a.ov).slice(0,7).sort((a,b)=>SPR[SPN(a)]-SPR[SPN(b)]);
  const col=(TEAM_COLORS[u.name]||themeFor(u.name).ac);
  const l=[1,3,5].map(i=>parseInt(col.substr(i,2),16)),tx=(0.3*l[0]+0.59*l[1]+0.11*l[2])>150?"#111":"#fff";
  const short=n=>{const w=n.split(" ");return w.length>1?w[w.length-1]:n};
  const bestF0=Game.bestFormation(u).f;
  const ctl=`<div class="row" style="align-items:center;margin:0 0 10px"><select onchange="setF(this.value)">${Object.keys(Game.FORMATIONS).map(f=>`<option value="${f}" ${u.formation===f?"selected":""}>${f}${f===bestF0?" (melhor)":""}</option>`).join("")}</select>${CONF?`<button class="p" onclick="confNext()">${CONF.i<CONF.q.length-1?"Confirmar e próximo time":"Confirmar e jogar"}</button><button class="s" onclick="confCancel()">Cancelar</button>`:`<button class="p" onclick="play()">Jogar</button><button class="p" onclick="playBest()">Jogar com melhor formação</button>`}</div>${CONF?`<p class="mut" style="margin:0 0 8px">Escalação ${CONF.i+1} de ${CONF.q.length}: ajuste o time e confirme.</p>`:""}`;
  let h=`<div class="card"><h2>Sua escalação${u.fAuto===false?"":` <span class="mut" style="font-size:12px;font-weight:400">· melhor formação automática</span>`}</h2>${ctl}`;
  if(!st.length)return h+`<p class="mut">Nenhum titular escalado. Toque em Auto na aba Elenco.</p><p><button class="s" onclick="setTab('elenco')">Mudar escalação</button></p></div>`;
  h+=`<div class="campo">`;
  const mids=st.filter(p=>p.pos==="MID");
  let m1=mids.filter(p=>SPN(p)!=="VOL"),m2=mids.filter(p=>SPN(p)==="VOL");
  if(!m1.length){m1=m2;m2=[]}
  const atts=st.filter(p=>p.pos==="ATT");
  let a1=atts.filter(p=>!["PE","PD"].includes(SPN(p))),a2=atts.filter(p=>["PE","PD"].includes(SPN(p)));
  if(!a1.length||atts.length!==3){a1=atts;a2=[]}
  const rows=[a1,a2,m1,m2,st.filter(p=>p.pos==="DEF"),st.filter(p=>p.pos==="GK")];
  for(const g of rows){if(!g.length)continue;
    g.sort((a,b)=>(SPO[SPN(a)]-SPO[SPN(b)])||a.name.localeCompare(b.name));
    h+=`<div class="lin${g.length===2&&g[0].pos==="ATT"?" dup":""}">`+g.map(p=>`<div class="jog"><i style="background:${col};color:${tx}">${p.ov}</i><span>${p.name}</span><small>${SPN(p)}</small></div>`).join("")+`</div>`}
  h+=`</div>`;
  if(res.length)h+=`<p class="mut" style="margin:8px 0 0">Banco: ${res.map(p=>`${p.name} (${SPN(p)} ${p.ov})`).join(", ")}</p>`;
  return h+`<p><button class="s" onclick="setTab('elenco')">Mudar escalação</button></p></div>`;
}
function accept(tid){const e=Game.acceptOffer(S,tid);if(e){alert(e);return}viewKey=null;msg=`<p class="good">Você agora comanda o ${U().name}. Save criado com o nome do novo time.</p>`;save();render()}
function playBest(){const u=U();u.fAuto=true;autoBest(u);save();play()}
function bestF(){const u=U(),b=Game.bestFormation(u);u.formation=b.f;u.lineup=b.ids;msg=`Melhor formação: <b>${b.f}</b> (OVR ${b.ovr.toFixed(1)}${b.miss?`, ${b.miss} jogador(es) fora da posição exata`:""}). Lesionados e suspensos não entram.`;save();render()}
function setF(f){const u=U();u.fAuto=false;u.formation=f;u.lineup=Game.autoLineup(u,f);save();render()}
const sc=a=>a.length?a.join(", "):"–";
let CONF=null;
function play(){
  const nr=Game.myClubs(S).length>1?Game.nextRoundClubs(S):null;
  if(nr&&nr.clubs.length>1){CONF={q:nr.clubs,i:0};confShow();return}
  doPlay()}
function confShow(){if(S.user!==CONF.q[CONF.i])Game.switchClub(S,CONF.q[CONF.i]);viewKey=null;tab="jogo";msg="";save();render();window.scrollTo(0,0)}
function confNext(){if(CONF.i<CONF.q.length-1){CONF.i++;confShow()}else{CONF=null;doPlay()}}
function confCancel(){CONF=null;render()}
function doPlay(){
  const r=Game.playRound(S);
  let t=`<h2>${r.date}</h2>`;
  r.reports.forEach(m=>{t+=`<p class="mut">${m.comp}</p><div class="big">${m.home} ${m.gh} x ${m.ga} ${m.away}</div><p class="mut">${m.home}: ${sc(m.sh)}<br>${m.away}: ${sc(m.sa)}</p>`});
  if(r.wages)t+=`<p>Salários: <span class="bad">-${money(r.wages)}</span>${r.gate?` · Bilheteria: <span class="good">+${money(r.gate)}</span>`:""}</p>`;
  r.notes.forEach(x=>t+=`<p>${x}</p>`);
  if(r.fixed)t+=`<p class="mut">Escalação inválida: o auxiliar escalou o time automaticamente.</p>`;
  if(r.skipped)t+=`<p class="mut">${r.skipped} rodada(s) sem jogo seu foram simuladas.</p>`;
  msg=t+`<p class="mut">💾 Jogo salvo automaticamente.</p>`;save();render();
}

function vElenco(){
  const u=U(),set=new Set(u.lineup);
  const order={GK:0,DEF:1,MID:2,ATT:3};
  const ps=u.players.slice().sort((a,b)=>SPR[SPN(a)]-SPR[SPN(b)]||b.ov-a.ov);
  return aucCard()+`<div class="card"><h2>Escalação (${u.lineup.length}/11)</h2>
  <div class="row"><button class="s" onclick="U().lineup=Game.autoLineup(U());save();render()">Auto</button><span class="mut">Toque para titular/reserva</span></div></div>
  <div class="card">${ps.map(p=>`<div class="pl ${set.has(p.id)?"in":""}" onclick="tog(${p.id})"><span><span class="pos">${SPN(p)}</span>${p.name} <span class="mut">${p.age}a</span>${p.inj>0?` <span class="bad">🚑 ${p.inj} jogo${p.inj>1?"s":""}</span>`:""}${p.sus>0?` <span class="bad">🟥 susp. ${p.sus}</span>`:""}${p.yc?` <span class="mut">🟨${p.yc}</span>`:""}</span><span><b>${p.ov}</b> <button class="s d" onclick="event.stopPropagation();sell(${p.id})">Leiloar</button> <span class="mut" title="Valor mínimo de venda">${money(p.value)}</span></span></div>`).join("")}</div>`;
}
function tog(id){const u=U(),i=u.lineup.indexOf(id);u.fAuto=false;const pp=u.players.find(x=>x.id===id);if(pp&&!Game.avail(pp)&&i<0){alert(pp.name+" está "+(pp.sus>0?"suspenso":"lesionado")+".");return}if(i>=0)u.lineup.splice(i,1);else if(u.lineup.length<11)u.lineup.push(id);save();render()}
let AUC=null;
function sell(id){if(!confirm("Leiloar este jogador? Vence o maior lance."))return;const a=Game.auction(S,id);if(a.err){alert(a.err);return}
  if(a.bids.length){const w=a.bids[0];const e=Game.sellTo(S,id,w.tid,w.bid);if(e){alert(e);return}a.sold=w;save()}
  AUC=a;render();window.scrollTo(0,0)}
function cancelAuc(){AUC=null;render()}
function aucCard(){
  if(!AUC)return"";const a=AUC;
  let h=`<div class="card"><h2>Leilão: ${a.name}</h2>${a.sold?`<p><b class="good">Vendido para ${a.sold.name} por ${money(a.sold.bid)}</b></p>`:""}<p class="mut">${SPN(a)} · OVR ${a.ov} · valor de mercado ${money(a.value)}</p>`;
  if(!a.bids.length)h+=`<p class="warn">Nenhum clube pagou o valor mínimo (${money(a.value)}) por este jogador.</p>`;
  else h+=a.bids.map((b,i)=>`<div class="pl ${i===0?"in":""}"><span>${i===0?"🏆 ":""}<b>${b.name}</b><br><span class="mut">${b.league} · ${b.country}</span></span><span><b class="good">${money(b.bid)}</b></span></div>`).join("");
  return h+`<p class="mut">Vence o maior lance.</p><p><button class="s" onclick="cancelAuc()">Fechar</button></p></div>`;
}

function compOpts(cur){
  const cs=Object.values(S.comps).filter(c=>!c.id.endsWith("_K")||true);
  const mine=cs.filter(c=>c.ids.includes(S.user)),rest=cs.filter(c=>!c.ids.includes(S.user));
  const o=c=>`<option value="${c.id}" ${c.id===cur?"selected":""}>${c.name}${c.done?" ✓":""}</option>`;
  return `<optgroup label="Seu clube">${mine.map(o).join("")}</optgroup><optgroup label="Outras">${rest.map(o).join("")}</optgroup>`;
}
function tbl(c,ids,hl){
  const t=Game.sortTab(ids,c.tab);
  return `<table><tr><th class="l">Time</th><th>P</th><th>J</th><th>V</th><th>E</th><th>D</th><th>SG</th></tr>`+
  t.map((id,i)=>{const r=c.tab[id];return `<tr class="${id===S.user?"me":""}"><td class="l">${i+1}. ${S.teams[id].name}</td><td>${r.pts}</td><td>${r.p}</td><td>${r.w}</td><td>${r.d}</td><td>${r.l}</td><td>${r.gf-r.ga}</td></tr>`}).join("")+`</table>`;
}
function vTabela(){
  let id=viewKey&&S.comps[viewKey]?viewKey:null;
  if(!id){const mine=Object.values(S.comps).filter(c=>!c.done&&c.ids.includes(S.user));id=(mine.find(c=>c.after==="lg")||mine[0]||Object.values(S.comps)[0]).id}
  const c=S.comps[id];
  let h=`<div class="card"><select onchange="viewKey=this.value;render()" style="width:100%">${compOpts(id)}</select></div>`;
  if(c.groups){
    h+=c.groups.map((g,i)=>`<div class="card"><h2>${c.name} — Grupo ${String.fromCharCode(65+i)}</h2>${tbl(c,g)}</div>`).join("");
  }else if(c.R&&!(c.after==="cup")){
    h+=`<div class="card"><h2>${c.name}</h2>${tbl(c,c.ids)}${c.after==="euS"&&c.final?'<p class="mut">Top 8 direto nas oitavas; 9º a 24º no playoff.</p>':""}</div>`;
  }
  if(c.ties){
    h+=`<div class="card"><h2>${c.name} — ${c.stage}</h2>`+c.ties.map(t=>{
      const a=S.teams[t.a].name,b=S.teams[t.b].name,res=t.res.map(r=>r.join("x")).join(" / ");
      return `<div class="pl"><span class="${t.a===S.user||t.b===S.user?"good":""}">${a} × ${b}</span><span class="mut">${res||"a jogar"}${t.w!==null?` → <b>${S.teams[t.w].name}</b>${t.pens?" (pên.)":""}`:""}</span></div>`}).join("")+`</div>`;
    if(c.champion)h+=`<div class="card">Campeão: <b>${S.teams[c.champion].name}</b></div>`;
  }
  return h;
}

function vMercado(){
  let l=Game.market(S).filter(p=>(!mf.pos||SPN(p)===mf.pos)&&p.ov>=mf.min&&(!mf.q||(p.name+p.team).toLowerCase().includes(mf.q.toLowerCase())));
  l.sort((a,b)=>b.ov-a.ov);const n=l.length;l=l.slice(0,40);
  return `<div class="card"><h2>Mercado</h2><div class="row">
  <select onchange="mf.pos=this.value;render()"><option value="">Todas</option>${["GOL","LD","LE","ZAG","VOL","ME","MD","MC","PD","PE","CA"].map(p=>`<option ${mf.pos===p?"selected":""}>${p}</option>`).join("")}</select>
  <select onchange="mf.min=+this.value;render()">${[0,60,65,70,75].map(v=>`<option value="${v}" ${mf.min===v?"selected":""}>OVR ≥ ${v}</option>`).join("")}</select>
  <input placeholder="nome/time" value="${mf.q}" onchange="mf.q=this.value;render()" style="flex:1;min-width:100px"></div>
  <p class="mut">${n} jogadores · preço = valor +15% · mostrando os 40 melhores</p></div>
  <div class="card">${l.map(p=>`<div class="pl"><span><span class="pos">${SPN(p)}</span>${p.name} <span class="mut">${p.age}a · ${p.team}</span></span><span><b>${p.ov}</b> <button class="s p" onclick="buy(${p.id})">${money(Math.round(p.value*1.15))}</button></span></div>`).join("")}</div>`;
}
function buy(id){const e=Game.buy(S,id);if(e)alert(e);save();render()}

function vMais(){
  const u=U(),w=u.players.reduce((s,p)=>s+p.wage,0);
  return `<div class="card"><h2>Finanças</h2><p>Caixa: <b>${moneyFull(S.cash)}</b><br>Folha por rodada: ${money(w)}<br>Torcida (estimada): ${u.fans} mil<br>Reputação: ${S.rep}/100</p></div>
  <div class="card"><h2>Meus times</h2>${Game.myClubs(S).map(id=>`<div class="pl ${id===S.user?"in":""}"><span><b>${S.teams[id].name}</b><br><span class="mut">Caixa ${moneyFull(id===S.user?S.cash:(S.cashes&&S.cashes[id])||0)}${id===S.user?" · ativo":""}</span></span><span>${id===S.user?"":`<button class="s p" onclick="swClub(${id})">Comandar</button> <button class="s d" onclick="dropClubUI(${id})">Largar</button>`}</span></div>`).join("")}
  <div class="row" style="margin-top:8px"><select id="addSel" style="flex:1;min-width:0">${clubOpts()}</select><button class="p" onclick="addClubUI()">Adicionar time</button></div>
  <p class="mut">Cada time tem elenco, escalação e caixa próprios. O jogo avança até a próxima partida do time ativo; os outros times seus jogam com escalação automática se ela ficar inválida e pagam salários e recebem bilheteria. Prêmios e propostas de fim de temporada só valem para o time ativo.</p></div>
  <div class="card"><h2>Save e elencos</h2><p class="mut">Salvamento automático com o nome do time (${u.name}).</p>
  <div class="row"><button onclick="exportSave()">Exportar save</button><button onclick="start()">Trocar de save / novo jogo</button></div>
  <p><button class="p" onclick="update(false)">Atualizar elencos (elencos.json)</button></p>
  <p class="mut">Atualiza todos os times, exceto o seu. O seu elenco nunca é alterado enquanto você for o técnico; jogadores que você vendeu ficam no clube comprador.</p>${msg?`<p>${msg}</p>`:""}</div>`;
}
async function update(auto){
  try{const r=await fetch("elencos.json?"+Date.now());if(!r.ok)throw 0;const d=await r.json();
    if(auto&&d.updated&&S.lastUpd===d.updated)return;
    const x=Game.applyUpdate(S,d);S.lastUpd=d.updated||"";msg=`Elencos atualizados (${d.updated||"?"}): ${x.teams} times, ${x.kept} jogadores vendidos mantidos nos compradores.`+(x.left.length?`<br>Saíram do seu time (transferência real): ${x.left.join("; ")}`:"");save()}
  catch(e){if(!auto)msg="Ainda não há elencos.json publicado."}
  if(S)render();
}
try{const last=localStorage.getItem("elifoot:last");if(last&&localStorage.getItem(PREFIX+last))loadSave(last);else render()}catch(e){render()}
if(S)update(true); // atualiza sozinho ao abrir, se houver elencos.json novo
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
